server {
    listen 80;

    location /api/v1/auth {
        proxy_pass http://auth-service:5001;
    }

    location /api/v1/donors {
        proxy_pass http://donor-service:5002;
    }

    location /api/v1/requests {
        proxy_pass http://request-service:5003;
    }

    location /api/v1/notifications {
        proxy_pass http://notification-service:5004;
    }

    location /api/v1/hospital {
        proxy_pass http://hospital-service:5005;
    }
}
