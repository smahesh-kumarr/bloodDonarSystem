<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .system { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 18; ry: 18; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 18px Arial, sans-serif; fill: #0f172a; }
      .actor-text { font: 600 18px Arial, sans-serif; fill: #1e293b; text-anchor: middle; }
      .usecase { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .usecase-text { font: 600 16px Arial, sans-serif; fill: #7f1d1d; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; }
      .actor-stroke { stroke: #0f172a; stroke-width: 3; fill: none; stroke-linecap: round; }
    </style>
